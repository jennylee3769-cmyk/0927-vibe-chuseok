<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공유 미리보기 원본</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:#F6C744;color:#111}
.card{position:relative;width:1200px;height:630px;background:url('../assets/og-chuseok-background.png') center/cover no-repeat;overflow:hidden}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(246,199,68,.98) 0%,rgba(246,199,68,.94) 52%,rgba(246,199,68,.10) 75%)}
.copy{position:absolute;left:64px;top:54px;width:690px}.eyebrow{display:inline-block;padding:9px 16px;background:#111;color:#fff;border:3px solid #fff;box-shadow:6px 6px 0 #111;font-size:23px;font-weight:900;letter-spacing:.08em;transform:rotate(-2deg)}
h1{margin:42px 0 26px;font-size:74px;line-height:1.08;letter-spacing:-.065em;font-weight:900;text-wrap:balance}.sub{width:max-content;max-width:670px;padding:13px 18px;background:#fff;border:4px solid #111;box-shadow:7px 7px 0 #111;font-size:25px;font-weight:800}.speaker{position:absolute;left:66px;bottom:46px;font-size:21px;font-weight:900}
.stamp{position:absolute;right:54px;top:46px;padding:10px 16px;border:4px solid #111;background:#fff;font-size:20px;font-weight:900;transform:rotate(4deg)}
</style>
</head>
<body>
<main class="card">
  <div class="shade"></div>
  <div class="copy">
    <div class="eyebrow">AI CLASS · 2시간 실습</div>
    <h1>바이브코딩으로<br>추석 인사말 선화<br>영상 만들기</h1>
    <div class="sub">2026년 9월 30일 오후 8시~10시</div>
  </div>
  <div class="speaker">이정임 강사 · 공부방 · 학원 원장 · 1인기업가 · 소상공인</div>
  <div class="stamp">추석 영상 실습</div>
</main>
</body>
</html>
